<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jour 3 — Vérité ou Défi 🎲</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E8672A;
    --orange-light: #FDEEE6;
    --orange-dark: #9A3E10;
    --cream: #fdf8f5;
    --dark: #1a0f0a;
    --text: #3d2010;
    --muted: #9a7060;
    --border: rgba(232,103,42,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--cream); color: var(--text); font-family: 'Jost', sans-serif; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(232,103,42,0.08) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 10% 90%, rgba(232,103,42,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; }

  .intro-wrap { text-align: center; max-width: 420px; }
  .petal { font-size: 40px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .day-badge { display: inline-block; font-size: 11px; letter-spacing: 0.12em; font-weight: 500; padding: 4px 14px; border-radius: 99px; background: var(--orange-light); color: var(--orange-dark); margin-bottom: 1rem; text-transform: uppercase; }
  .intro-title { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; line-height: 1.15; color: var(--dark); margin-bottom: 0.5rem; }
  .intro-title em { font-style: italic; color: var(--orange); }
  .intro-sub { font-size: 14px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 2.5rem; line-height: 1.7; }
  .btn-start { background: var(--orange); color: white; border: none; border-radius: 99px; padding: 14px 40px; font-family: 'Jost', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.2s; }
  .btn-start:hover { background: var(--orange-dark); transform: translateY(-1px); }

  .game-wrap { width: 100%; max-width: 500px; }
  .progress-track { height: 3px; background: rgba(232,103,42,0.15); border-radius: 99px; margin-bottom: 2rem; }
  .progress-fill { height: 100%; background: var(--orange); border-radius: 99px; transition: width 0.5s ease; }

  .type-selector { display: flex; gap: 12px; margin-bottom: 1.5rem; }
  .type-btn { flex: 1; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); background: white; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-align: center; }
  .type-btn.verite { color: #3C3489; border-color: rgba(127,119,221,0.3); }
  .type-btn.verite:hover, .type-btn.verite.active { background: #EEEDFE; border-color: #7F77DD; }
  .type-btn.defi { color: var(--orange-dark); border-color: var(--border); }
  .type-btn.defi:hover, .type-btn.defi.active { background: var(--orange-light); border-color: var(--orange); }

  .card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
  .card-label { font-size: 11px; letter-spacing: 0.1em; font-weight: 500; text-transform: uppercase; margin-bottom: 12px; }
  .card-label.v { color: #7F77DD; }
  .card-label.d { color: var(--orange); }
  .card-text { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; line-height: 1.4; color: var(--dark); }

  .open-area { width: 100%; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 15px; font-family: 'Cormorant Garamond', serif; color: var(--dark); resize: none; min-height: 80px; transition: border-color 0.15s; margin-top: 10px; }
  .open-area:focus { outline: none; border-color: var(--orange); }
  .open-area::placeholder { color: var(--muted); font-style: italic; }

  .defi-confirm { display: flex; gap: 10px; margin-top: 1rem; }
  .defi-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.15s; background: white; }
  .defi-btn.yes { color: #1D9E75; border-color: rgba(29,158,117,0.3); }
  .defi-btn.yes:hover, .defi-btn.yes.sel { background: #E1F5EE; border-color: #1D9E75; font-weight: 500; }
  .defi-btn.no { color: #a32d2d; border-color: rgba(163,45,45,0.3); }
  .defi-btn.no:hover, .defi-btn.no.sel { background: #FCEBEB; border-color: #a32d2d; font-weight: 500; }

  .game-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
  .btn-next { background: var(--orange); color: white; border: none; border-radius: 99px; padding: 11px 28px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.18s; }
  .btn-next:hover:not(:disabled) { background: var(--orange-dark); }
  .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }
  .counter { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }

  .done-wrap { text-align: center; max-width: 460px; width: 100%; }
  .done-icon { font-size: 52px; margin-bottom: 1.2rem; }
  .done-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; color: var(--dark); margin-bottom: 10px; }
  .done-sub { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }
  .copy-box { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; text-align: left; }
  .copy-box-title { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .copy-text { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--dark); line-height: 1.8; white-space: pre-wrap; }
  .btn-copy { width: 100%; margin-top: 14px; background: var(--orange); color: white; border: none; border-radius: 99px; padding: 13px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .btn-copy.copied { background: #1D9E75; }
  .copy-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div id="s-intro" class="screen active">
  <div class="intro-wrap">
    <div class="petal">🎲</div>
    <span class="day-badge">Jour 3</span>
    <h1 class="intro-title">Vérité<br><em>ou Défi</em></h1>
    <p class="intro-sub">Choisis entre répondre honnêtement<br>ou relever le défi... si tu oses 😈</p>
    <button class="btn-start" onclick="startGame()">Je suis prête ✨</button>
  </div>
</div>

<div id="s-game" class="screen">
  <div class="game-wrap">
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <div id="q-area"></div>
  </div>
</div>

<div id="s-done" class="screen">
  <div class="done-wrap">
    <div class="done-icon">🔥</div>
    <h2 class="done-title">Bien joué !</h2>
    <p class="done-sub">Envoie tes réponses sur WhatsApp 😘</p>
    <div class="copy-box">
      <div class="copy-box-title">Mes réponses 🎲</div>
      <div class="copy-text" id="copy-text"></div>
    </div>
    <button class="btn-copy" id="btn-copy" onclick="copyAnswers()">📋 Copier mes réponses</button>
    <p class="copy-hint">Puis colle-les dans WhatsApp et envoie-les lui 😘</p>
  </div>
</div>

<script>
const verites = [
  "Quelle est la chose la plus osée que tu aies jamais faite avec quelqu'un ?",
  "Décris-moi en détail ce que tu ressens quand on fait l'amour...",
  "C'est quoi ton fantasme le plus secret que tu n'as encore jamais réalisé ?",
  "Quelle partie de ton corps aimes-tu le moins... et laquelle tu veux que je touche le plus ?",
  "T'est-il déjà arrivé de penser à moi dans un moment intime seule ? 😏",
  "Qu'est-ce que tu ferais si tu savais que je ne pourrais pas refuser ce soir ?",
  "Quel endroit insolite tu aimerais qu'on essaie ensemble ?",
  "Décris-moi la chose que je fais qui te rend la plus folle de désir..."
];

const defis = [
  "Envoie-moi un message vocal en murmurant quelque chose de coquin 🎤",
  "Prends une photo de l'endroit de ton corps que tu préfères et envoie-la moi 📸",
  "Décris-moi par écrit exactement ce que tu voudrais qu'on fasse ce soir ✍️",
  "Envoie-moi le premier emoji coquin qui te passe par la tête... et explique pourquoi 😏",
  "Dis-moi un mot qui résume ce que tu ressens pour moi en ce moment 💬",
  "Envoie-moi la chanson qui te fait penser à nous deux 🎵",
  "Décris en 3 mots comment tu veux que finisse cette soirée 🌙",
  "Envoie-moi un GIF qui représente ce que tu voudrais me faire 😈"
];

let cur = 0, answers = [], choix = null, defiSel = null;
const total = 6;
let usedV = [], usedD = [];

function getRandom(arr, used) {
  const available = arr.map((v,i)=>i).filter(i=>!used.includes(i));
  if (!available.length) { used.length = 0; return getRandom(arr, used); }
  const idx = available[Math.floor(Math.random()*available.length)];
  used.push(idx);
  return { text: arr[idx], idx };
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startGame() { cur = 0; answers = []; choix = null; showScreen('s-game'); renderQ(); }

function renderQ() {
  if (cur >= total) { buildDone(); showScreen('s-done'); return; }
  const pct = (cur / total) * 100;
  document.getElementById('prog').style.width = pct + '%';
  choix = null; defiSel = null;

  document.getElementById('q-area').innerHTML = `
    <div class="type-selector">
      <button class="type-btn verite" id="btn-v" onclick="choisir('verite')">💜 Vérité</button>
      <button class="type-btn defi" id="btn-d" onclick="choisir('defi')">🔥 Défi</button>
    </div>
    <div class="card" id="card">
      <p style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--muted);font-style:italic;text-align:center;">Choisis Vérité ou Défi...</p>
    </div>
    <div id="reponse-area"></div>
    <div class="game-nav">
      <span class="counter">${cur+1} / ${total}</span>
      <button class="btn-next" id="btn-next" disabled onclick="next()">
        ${cur===total-1?'Terminer ✨':'Suivant →'}
      </button>
    </div>`;
}

function choisir(type) {
  choix = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(type==='verite'?'btn-v':'btn-d').classList.add('active');

  if (type === 'verite') {
    const q = getRandom(verites, usedV);
    document.getElementById('card').innerHTML = `<span class="card-label v">💜 Vérité</span><p class="card-text">${q.text}</p>`;
    document.getElementById('reponse-area').innerHTML = `<textarea class="open-area" id="oa" placeholder="Réponds honnêtement... 🤫"></textarea>`;
    document.getElementById('btn-next').disabled = false;
  } else {
    const d = getRandom(defis, usedD);
    document.getElementById('card').innerHTML = `<span class="card-label d">🔥 Défi</span><p class="card-text">${d.text}</p>`;
    document.getElementById('reponse-area').innerHTML = `
      <div class="defi-confirm">
        <button class="defi-btn yes" onclick="selDefi(this,'✅ Défi relevé !')" >✅ Défi relevé !</button>
        <button class="defi-btn no" onclick="selDefi(this,'❌ Trop peur !')">❌ Trop peur !</button>
      </div>`;
  }
}

function selDefi(btn, val) {
  document.querySelectorAll('.defi-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  defiSel = val;
  document.getElementById('btn-next').disabled = false;
}

function next() {
  let ans = '';
  if (choix === 'verite') {
    ans = document.getElementById('oa').value.trim() || '...';
  } else {
    ans = defiSel || '...';
  }
  const cardText = document.querySelector('.card-text')?.textContent || '';
  answers.push({ type: choix, q: cardText, a: ans });
  cur++; renderQ();
}

function buildDone() {
  const lines = answers.map((a,i) => `${i+1}. [${a.type==='verite'?'Vérité':'Défi'}] ${a.q}\n➜ ${a.a}`).join('\n\n');
  const full = `🎲 Mes réponses — Jour 3 :\n\n${lines}\n\n😘`;
  document.getElementById('copy-text').textContent = full;
}

function copyAnswers() {
  const text = document.getElementById('copy-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Copié ! Colle ça dans WhatsApp 😘';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copier mes réponses'; btn.classList.remove('copied'); }, 3000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(document.getElementById('copy-text'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Copié !';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copier mes réponses'; btn.classList.remove('copied'); }, 3000);
  });
}
</script>
</body>
</html>
