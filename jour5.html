<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jour 5 — Je t'aime parce que... 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #c94f7c;
    --rose-light: #f7dce8;
    --rose-dark: #8a2f52;
    --cream: #fdf6f0;
    --dark: #1a0f14;
    --text: #3d1f2d;
    --muted: #9a7080;
    --border: rgba(201,79,124,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--cream); color: var(--text); font-family: 'Jost', sans-serif; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(201,79,124,0.08) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 10% 90%, rgba(201,79,124,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; }

  .intro-wrap { text-align: center; max-width: 420px; }
  .petal { font-size: 40px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);} }
  .day-badge { display: inline-block; font-size: 11px; letter-spacing: 0.12em; font-weight: 500; padding: 4px 14px; border-radius: 99px; background: var(--rose-light); color: var(--rose-dark); margin-bottom: 1rem; text-transform: uppercase; }
  .intro-title { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; line-height: 1.15; color: var(--dark); margin-bottom: 0.5rem; }
  .intro-title em { font-style: italic; color: var(--rose); }
  .intro-sub { font-size: 14px; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.7; }
  .btn-start { background: var(--rose); color: white; border: none; border-radius: 99px; padding: 14px 40px; font-family: 'Jost', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.2s; }
  .btn-start:hover { background: var(--rose-dark); }

  .game-wrap { width: 100%; max-width: 500px; }
  .progress-track { height: 3px; background: rgba(201,79,124,0.15); border-radius: 99px; margin-bottom: 2rem; }
  .progress-fill { height: 100%; background: var(--rose); border-radius: 99px; transition: width 0.5s ease; }

  .card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; }
  .card-label { font-size: 11px; letter-spacing: 0.1em; font-weight: 500; text-transform: uppercase; color: var(--rose); margin-bottom: 12px; }
  .phrase-debut { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--muted); font-style: italic; margin-bottom: 10px; line-height: 1.4; }
  .phrase-debut span { color: var(--rose); font-weight: 500; }

  .open-area { width: 100%; background: var(--cream); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 16px; font-family: 'Cormorant Garamond', serif; color: var(--dark); resize: none; min-height: 90px; transition: border-color 0.15s; }
  .open-area:focus { outline: none; border-color: var(--rose); }
  .open-area::placeholder { color: var(--muted); font-style: italic; }

  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .choice { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; text-align: left; cursor: pointer; font-size: 14px; color: var(--text); font-family: 'Jost', sans-serif; transition: all 0.15s; }
  .choice:hover { border-color: var(--rose); background: var(--rose-light); color: var(--rose-dark); }
  .choice.sel { border-color: var(--rose); background: var(--rose-light); color: var(--rose-dark); font-weight: 500; }

  .game-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
  .btn-next { background: var(--rose); color: white; border: none; border-radius: 99px; padding: 11px 28px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; }
  .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }
  .counter { font-size: 12px; color: var(--muted); }

  .done-wrap { text-align: center; max-width: 460px; width: 100%; }
  .done-icon { font-size: 52px; margin-bottom: 1.2rem; }
  .done-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; color: var(--dark); margin-bottom: 10px; }
  .done-sub { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }
  .copy-box { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; text-align: left; }
  .copy-box-title { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .copy-text { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--dark); line-height: 1.8; white-space: pre-wrap; }
  .btn-copy { width: 100%; margin-top: 14px; background: var(--rose); color: white; border: none; border-radius: 99px; padding: 13px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; }
  .btn-copy.copied { background: #1D9E75; }
  .copy-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div id="s-intro" class="screen active">
  <div class="intro-wrap">
    <div class="petal">💕</div>
    <span class="day-badge">Jour 5</span>
    <h1 class="intro-title">Je t'aime<br><em>parce que...</em></h1>
    <p class="intro-sub">Complète ces phrases du fond du cœur...<br>Sois honnête, c'est pour lui 🌹</p>
    <button class="btn-start" onclick="startGame()">Commencer ✨</button>
  </div>
</div>

<div id="s-game" class="screen">
  <div class="game-wrap">
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <div id="q-area"></div>
  </div>
</div>

<div id="s-done" class="screen">
  <div class="done-wrap">
    <div class="done-icon">💝</div>
    <h2 class="done-title">C'est tellement beau...</h2>
    <p class="done-sub">Envoie tes réponses sur WhatsApp 😘</p>
    <div class="copy-box">
      <div class="copy-box-title">Mes réponses 💕</div>
      <div class="copy-text" id="copy-text"></div>
    </div>
    <button class="btn-copy" id="btn-copy" onclick="copyAnswers()">📋 Copier mes réponses</button>
    <p class="copy-hint">Puis colle-les dans WhatsApp et envoie-les lui 😘</p>
  </div>
</div>

<script>
const questions = [
  { type:'ouverte', label:'💕 Complète la phrase', debut:'Je t\'aime parce que...', placeholder:'Continue cette phrase...' },
  { type:'choix', label:'💕 Complète la phrase', debut:'Ce que je préfère chez toi c\'est...', choices:['Ton caractère unique','Ta façon de prendre soin de moi','Ton regard qui me fait fondre','Tout, absolument tout'] },
  { type:'ouverte', label:'🌹 Complète la phrase', debut:'Quand tu me prends dans tes bras je me sens...', placeholder:'Décris ce que tu ressens...' },
  { type:'choix', label:'🌹 Complète la phrase', debut:'Sans toi ma vie serait...', choices:['Beaucoup moins belle','Vide de sens','Plus terne et sans couleur','Impensable'] },
  { type:'ouverte', label:'💫 Complète la phrase', debut:'La chose qui me manque le plus quand tu n\'es pas là c\'est...', placeholder:'Sois honnête...' },
  { type:'choix', label:'💫 Complète la phrase', debut:'Tu es la seule personne qui...', choices:['Me comprend vraiment','Me fait sentir unique','Me donne envie d\'être meilleure','Tout ça à la fois 💕'] },
  { type:'ouverte', label:'🔥 Complète la phrase', debut:'Ce que j\'aime le plus dans notre intimité c\'est...', placeholder:'Dis-lui tout...' },
  { type:'choix', label:'🔥 Complète la phrase', debut:'Quand je pense à notre avenir je vois...', choices:['Deux amoureux complices pour toujours','Une belle famille et plein de bonheur','Des aventures et des souvenirs inoubliables','Tout ce dont j\'ai toujours rêvé'] },
  { type:'ouverte', label:'💌 Complète la phrase', debut:'Si je devais te décrire en un seul mot ce serait...', placeholder:'Quel mot ?' },
  { type:'ouverte', label:'💌 Message libre', debut:'Ce que je n\'ai jamais osé te dire et que j\'ai envie de te dire maintenant...', placeholder:'Écris librement, c\'est le moment 💕' },
];

let cur = 0, answers = [], sel = null;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startGame() { cur = 0; answers = []; sel = null; showScreen('s-game'); renderQ(); }

function renderQ() {
  if (cur >= questions.length) { buildDone(); showScreen('s-done'); return; }
  const q = questions[cur];
  const pct = (cur / questions.length) * 100;
  document.getElementById('prog').style.width = pct + '%';
  sel = null;

  const reponseHtml = q.type === 'ouverte'
    ? `<textarea class="open-area" id="oa" placeholder="${q.placeholder}"></textarea>`
    : `<div class="choices">${q.choices.map((c,i) => `<button class="choice" onclick="pick(this,${i})">${c}</button>`).join('')}</div>`;

  document.getElementById('q-area').innerHTML = `
    <div class="card">
      <div class="card-label">${q.label}</div>
      <p class="phrase-debut">${q.debut}</p>
      ${reponseHtml}
    </div>
    <div class="game-nav">
      <span class="counter">${cur+1} / ${questions.length}</span>
      <button class="btn-next" id="btn-next" ${q.type==='choix'?'disabled':''} onclick="next()">
        ${cur===questions.length-1?'Terminer ✨':'Suivant →'}
      </button>
    </div>`;
}

function pick(btn, i) {
  document.querySelectorAll('.choice').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel'); sel = i;
  document.getElementById('btn-next').disabled = false;
}

function next() {
  const q = questions[cur];
  const ans = q.type === 'ouverte'
    ? (document.getElementById('oa').value.trim() || '...')
    : q.choices[sel];
  answers.push({ debut: q.debut, a: ans });
  sel = null; cur++; renderQ();
}

function buildDone() {
  const lines = answers.map((a,i) => `${i+1}. ${a.debut}\n➜ ${a.a}`).join('\n\n');
  document.getElementById('copy-text').textContent = `💕 Mes réponses — Jour 5 :\n\n${lines}\n\n😘`;
}

function copyAnswers() {
  const text = document.getElementById('copy-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Copié ! Colle ça dans WhatsApp 😘';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copier mes réponses'; btn.classList.remove('copied'); }, 3000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(document.getElementById('copy-text'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Copié !';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copier mes réponses'; btn.classList.remove('copied'); }, 3000);
  });
}
</script>
</body>
</html>
