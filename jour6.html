<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jour 6 — Et si... 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --red: #E24B4A; --red-light: #FCEBEB; --red-dark: #A32D2D; --cream: #fdf5f5; --dark: #1a0a0a; --text: #3d1010; --muted: #9a7070; --border: rgba(226,75,74,0.2); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--cream); color: var(--text); font-family: 'Jost', sans-serif; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(226,75,74,0.07) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 10% 90%, rgba(226,75,74,0.05) 0%, transparent 70%); pointer-events: none; }
  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .intro-wrap { text-align: center; max-width: 420px; }
  .petal { font-size: 40px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);} }
  .day-badge { display: inline-block; font-size: 11px; letter-spacing: 0.12em; font-weight: 500; padding: 4px 14px; border-radius: 99px; background: var(--red-light); color: var(--red-dark); margin-bottom: 1rem; text-transform: uppercase; }
  .intro-title { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; line-height: 1.15; color: var(--dark); margin-bottom: 0.5rem; }
  .intro-title em { font-style: italic; color: var(--red); }
  .intro-sub { font-size: 14px; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.7; }
  .btn-start { background: var(--red); color: white; border: none; border-radius: 99px; padding: 14px 40px; font-family: 'Jost', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.2s; }
  .btn-start:hover { background: var(--red-dark); }
  .game-wrap { width: 100%; max-width: 500px; }
  .progress-track { height: 3px; background: rgba(226,75,74,0.15); border-radius: 99px; margin-bottom: 2rem; }
  .progress-fill { height: 100%; background: var(--red); border-radius: 99px; transition: width 0.5s ease; }
  .card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; }
  .card-label { font-size: 11px; letter-spacing: 0.1em; font-weight: 500; text-transform: uppercase; color: var(--red); margin-bottom: 12px; }
  .q-text { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; line-height: 1.4; color: var(--dark); font-style: italic; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
  .choice { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 13px 18px; text-align: left; cursor: pointer; font-size: 14px; color: var(--text); font-family: 'Jost', sans-serif; transition: all 0.15s; }
  .choice:hover { border-color: var(--red); background: var(--red-light); color: var(--red-dark); }
  .choice.sel { border-color: var(--red); background: var(--red-light); color: var(--red-dark); font-weight: 500; }
  .open-area { width: 100%; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 15px; font-family: 'Cormorant Garamond', serif; color: var(--dark); resize: none; min-height: 90px; transition: border-color 0.15s; margin-top: 10px; }
  .open-area:focus { outline: none; border-color: var(--red); }
  .open-area::placeholder { color: var(--muted); font-style: italic; }
  .game-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
  .btn-next { background: var(--red); color: white; border: none; border-radius: 99px; padding: 11px 28px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; }
  .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }
  .counter { font-size: 12px; color: var(--muted); }
  .done-wrap { text-align: center; max-width: 460px; width: 100%; }
  .done-icon { font-size: 52px; margin-bottom: 1.2rem; }
  .done-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; color: var(--dark); margin-bottom: 10px; }
  .done-sub { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }
  .copy-box { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; text-align: left; }
  .copy-box-title { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .copy-text { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--dark); line-height: 1.8; white-space: pre-wrap; }
  .btn-copy { width: 100%; margin-top: 14px; background: var(--red); color: white; border: none; border-radius: 99px; padding: 13px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; }
  .btn-copy.copied { background: #1D9E75; }
  .copy-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div id="s-intro" class="screen active">
  <div class="intro-wrap">
    <div class="petal">🔥</div>
    <span class="day-badge">Jour 6</span>
    <h1 class="intro-title">Et<br><em>si...</em></h1>
    <p class="intro-sub">Des scénarios rien que pour nous...<br>Réponds sans retenue 😈</p>
    <button class="btn-start" onclick="startGame()">Je suis prête ✨</button>
  </div>
</div>

<div id="s-game" class="screen">
  <div class="game-wrap">
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <div id="q-area"></div>
  </div>
</div>

<div id="s-done" class="screen">
  <div class="done-wrap">
    <div class="done-icon">🔥</div>
    <h2 class="done-title">La soirée peut commencer...</h2>
    <p class="done-sub">Envoie tes réponses sur WhatsApp 😘</p>
    <div class="copy-box">
      <div class="copy-box-title">Mes réponses 🔥</div>
      <div class="copy-text" id="copy-text"></div>
    </div>
    <button class="btn-copy" id="btn-copy" onclick="copyAnswers()">📋 Copier mes réponses</button>
    <p class="copy-hint">Puis colle-les dans WhatsApp et envoie-les lui 😘</p>
  </div>
</div>

<script>
const questions = [
  { type:'choix', text:"Et si on partait une nuit dans un hôtel sans prévenir personne... tu ferais quoi en premier ?", choices:["Commander le room service et manger au lit","Prendre un bain ensemble aux chandelles","Fermer les rideaux et ne plus sortir de la chambre","Te déshabiller lentement et prendre mon temps"] },
  { type:'choix', text:"Et si tu pouvais choisir l'endroit le plus fou pour faire l'amour, ce serait où ?", choices:["Sur une plage la nuit sous les étoiles","Dans une voiture garée au milieu de nulle part","Dans un jacuzzi privatif","Dans un endroit public mais discret... le frisson en plus"] },
  { type:'ouverte', text:"Et si tu avais 10 minutes pour me rendre fou de désir, tu ferais exactement quoi ?" },
  { type:'choix', text:"Et si on jouait à un jeu de rôle ce soir... tu choisirais lequel ?", choices:["Inconnus qui se draguent dans un bar","Massage qui dérape doucement","Tu es à moi pour la soirée entière","On invente notre propre scénario"] },
  { type:'ouverte', text:"Et si je t'envoyais un message ce soir disant 'Je t'attends'... qu'est-ce que tu porterais en arrivant ?" },
  { type:'choix', text:"Et si tu pouvais contrôler complètement notre prochaine nuit, tu dirais...", choices:["Lumières tamisées, musique douce, on prend notre temps","Passion pure, intensité, qu'on s'en souvienne longtemps","Tu décides de tout et je te fais confiance","On commence par parler et on verra où ça nous mène"] },
  { type:'ouverte', text:"Et si tu pouvais me murmurer une chose à l'oreille là maintenant, ce serait quoi ?" },
];

let cur=0, answers=[], sel=null;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startGame() { cur=0; answers=[]; sel=null; showScreen('s-game'); renderQ(); }

function renderQ() {
  if (cur >= questions.length) { buildDone(); showScreen('s-done'); return; }
  const q = questions[cur];
  const pct = (cur/questions.length)*100;
  document.getElementById('prog').style.width = pct+'%';
  sel=null;
  const reponseHtml = q.type==='choix'
    ? `<div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="pick(this,${i})">${c}</button>`).join('')}</div>`
    : `<textarea class="open-area" id="oa" placeholder="Réponds librement... c'est notre secret 😏"></textarea>`;
  document.getElementById('q-area').innerHTML = `
    <div class="card">
      <div class="card-label">🔥 Et si...</div>
      <p class="q-text">${q.text}</p>
      ${reponseHtml}
    </div>
    <div class="game-nav">
      <span class="counter">${cur+1} / ${questions.length}</span>
      <button class="btn-next" id="btn-next" ${q.type==='choix'?'disabled':''} onclick="next()">
        ${cur===questions.length-1?'Terminer ✨':'Suivant →'}
      </button>
    </div>`;
}

function pick(btn, i) {
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); sel=i;
  document.getElementById('btn-next').disabled=false;
}

function next() {
  const q = questions[cur];
  const ans = q.type==='choix' ? q.choices[sel] : (document.getElementById('oa').value.trim()||'...');
  answers.push({ q: q.text, a: ans });
  sel=null; cur++; renderQ();
}

function buildDone() {
  const lines = answers.map((a,i)=>`${i+1}. ${a.q}\n➜ ${a.a}`).join('\n\n');
  document.getElementById('copy-text').textContent = `🔥 Mes réponses — Jour 6 :\n\n${lines}\n\n😘`;
}

function copyAnswers() {
  const text = document.getElementById('copy-text').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('btn-copy');
    btn.textContent='✅ Copié ! Colle ça dans WhatsApp 😘';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copier mes réponses';btn.classList.remove('copied');},3000);
  }).catch(()=>{
    const range=document.createRange();
    range.selectNode(document.getElementById('copy-text'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    const btn=document.getElementById('btn-copy');
    btn.textContent='✅ Copié !';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copier mes réponses';btn.classList.remove('copied');},3000);
  });
}
</script>
</body>
</html>
