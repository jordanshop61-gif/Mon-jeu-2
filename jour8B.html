<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jour 8 — La Roue du Désir 🎰</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --purple: #8B5CF6; --purple-light: #EDE9FE; --purple-dark: #5B21B6; --cream: #faf8ff; --dark: #1a0a2e; --text: #2d1b4e; --muted: #8b7aa8; --border: rgba(139,92,246,0.2); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--cream); color: var(--text); font-family: 'Jost', sans-serif; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(139,92,246,0.08) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 10% 90%, rgba(201,79,124,0.06) 0%, transparent 70%); pointer-events: none; }
  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
  .intro-wrap { text-align: center; max-width: 420px; }
  .petal { font-size: 40px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);} }
  .day-badge { display: inline-block; font-size: 11px; letter-spacing: 0.12em; font-weight: 500; padding: 4px 14px; border-radius: 99px; background: var(--purple-light); color: var(--purple-dark); margin-bottom: 1rem; text-transform: uppercase; }
  .intro-title { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; line-height: 1.15; color: var(--dark); margin-bottom: 0.5rem; }
  .intro-title em { font-style: italic; color: var(--purple); }
  .intro-sub { font-size: 14px; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.7; }
  .btn-start { background: var(--purple); color: white; border: none; border-radius: 99px; padding: 14px 40px; font-family: 'Jost', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.2s; }
  .btn-start:hover { background: var(--purple-dark); }
  .game-wrap { width: 100%; max-width: 500px; text-align: center; }
  .spin-count { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }
  .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 1.5rem; }
  .wheel-arrow { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 28px; z-index: 10; }
  canvas { border-radius: 50%; box-shadow: 0 8px 32px rgba(139,92,246,0.25); }
  .btn-spin { background: var(--purple); color: white; border: none; border-radius: 99px; padding: 14px 40px; font-family: 'Jost', sans-serif; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem; }
  .btn-spin:hover:not(:disabled) { background: var(--purple-dark); transform: translateY(-1px); }
  .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }
  .result-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; display: none; text-align: left; }
  .result-type { font-size: 11px; letter-spacing: 0.1em; font-weight: 500; text-transform: uppercase; margin-bottom: 10px; }
  .result-type.action { color: #E24B4A; }
  .result-type.question { color: var(--purple); }
  .result-type.mystere { color: #D4537E; }
  .result-text { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; line-height: 1.4; color: var(--dark); margin-bottom: 12px; }
  .open-area { width: 100%; background: var(--cream); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 15px; font-family: 'Cormorant Garamond', serif; color: var(--dark); resize: none; min-height: 80px; margin-top: 8px; }
  .open-area:focus { outline: none; border-color: var(--purple); }
  .open-area::placeholder { color: var(--muted); font-style: italic; }
  .action-btns { display: flex; gap: 10px; margin-top: 4px; }
  .action-btn { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--border); font-family: 'Jost', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; background: white; }
  .action-btn.yes { color: #1D9E75; border-color: rgba(29,158,117,0.3); }
  .action-btn.yes.sel { background: #E1F5EE; border-color: #1D9E75; font-weight: 500; }
  .action-btn.no { color: #a32d2d; border-color: rgba(163,45,45,0.3); }
  .action-btn.no.sel { background: #FCEBEB; border-color: #a32d2d; font-weight: 500; }
  .extra-input { margin-top: 10px; display: none; }
  .btn-valider { width: 100%; background: var(--purple); color: white; border: none; border-radius: 99px; padding: 12px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; margin-top: 12px; display: none; }
  .done-wrap { text-align: center; max-width: 460px; width: 100%; }
  .done-icon { font-size: 52px; margin-bottom: 1.2rem; }
  .done-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; color: var(--dark); margin-bottom: 10px; }
  .done-sub { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }
  .copy-box { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; text-align: left; }
  .copy-box-title { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .copy-text { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--dark); line-height: 1.8; white-space: pre-wrap; }
  .btn-copy { width: 100%; margin-top: 14px; background: var(--purple); color: white; border: none; border-radius: 99px; padding: 13px; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer; }
  .btn-copy.copied { background: #1D9E75; }
  .copy-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div id="s-intro" class="screen active">
  <div class="intro-wrap">
    <div class="petal">🎰</div>
    <span class="day-badge">Jour 8</span>
    <h1 class="intro-title">La Roue<br><em>du Désir</em></h1>
    <p class="intro-sub">Tourne la roue et découvre ce qui t'attend...<br>Le hasard décide pour toi 😈</p>
    <button class="btn-start" onclick="startGame()">Tourner la roue ✨</button>
  </div>
</div>

<div id="s-game" class="screen">
  <div class="game-wrap">
    <p class="spin-count" id="spin-count">Tour 1 / 10</p>
    <div class="wheel-container">
      <div class="wheel-arrow">▼</div>
      <canvas id="wheel" width="300" height="300"></canvas>
    </div>
    <button class="btn-spin" id="btn-spin" onclick="spin()">🎰 Tourner !</button>
    <div class="result-card" id="result-card">
      <div class="result-type" id="result-type"></div>
      <p class="result-text" id="result-text"></p>
      <div id="result-input"></div>
      <button class="btn-valider" id="btn-valider" onclick="valider()">Suivant →</button>
    </div>
  </div>
</div>

<div id="s-done" class="screen">
  <div class="done-wrap">
    <div class="done-icon">🔥</div>
    <h2 class="done-title">La roue a parlé...</h2>
    <p class="done-sub">Envoie tes réponses sur WhatsApp 😘</p>
    <div class="copy-box">
      <div class="copy-box-title">Mes réponses 🎰</div>
      <div class="copy-text" id="copy-text"></div>
    </div>
    <button class="btn-copy" id="btn-copy" onclick="copyAnswers()">📋 Copier mes réponses</button>
    <p class="copy-hint">Puis colle dans WhatsApp et envoie-lui 😘</p>
  </div>
</div>

<script>
const allSegments = [
  { type:'question', label:'💜 Question', text:"Quelle partie de mon corps te rend la plus folle ?", color:'#8B5CF6' },
  { type:'action', label:'🔥 Action', text:"Envoie-moi un vocal en murmurant quelque chose de coquin 🎤", color:'#E24B4A' },
  { type:'question', label:'💜 Question', text:"C'est quoi la chose la plus osée que tu aimerais essayer avec moi ?", color:'#6D28D9' },
  { type:'action', label:'🔥 Action', text:"Envoie-moi 3 emojis qui décrivent notre prochaine nuit 😈", color:'#DB2777' },
  { type:'question', label:'💜 Question', text:"Quelle position tu préfères et pourquoi ? 😏", color:'#7C3AED' },
  { type:'action', label:'🔥 Action', text:"Décris en détail comment tu voudrais qu'on se retrouve bientôt ✍️", color:'#C94F7C' },
  { type:'question', label:'💜 Question', text:"Quel est l'endroit de ton corps où tu aimes le plus être touchée ?", color:'#5B21B6' },
  { type:'action', label:'🔥 Action', text:"Dis-moi en 3 mots comment tu veux que finisse notre prochaine soirée 🌙", color:'#B91C6A' },
  { type:'mystere', label:'🎁 Case Mystère', text:"Aimerais-tu goûter à mon sexe cette semaine ? 😏", color:'#D4537E' },
  { type:'mystere', label:'🎁 Case Mystère', text:"Puis-je toucher/caresser ton anus ? 🤪", color:'#9333EA' },
];

const total = 10;
let cur = 0, answers = [], spinning = false, currentSeg = null;
let remaining = [];
let actionSel = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startGame() {
  cur=0; answers=[]; remaining=shuffle([...allSegments]);
  showScreen('s-game'); drawWheel(remaining, 0);
}

function drawWheel(segs, angle) {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const cx=150, cy=150, r=145, n=segs.length;
  ctx.clearRect(0,0,300,300);
  segs.forEach((s,i) => {
    const start = angle+(i/n)*Math.PI*2-Math.PI/2;
    const end = angle+((i+1)/n)*Math.PI*2-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end); ctx.closePath();
    ctx.fillStyle=s.color; ctx.fill();
    ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle+((i+0.5)/n)*Math.PI*2-Math.PI/2);
    ctx.textAlign='right';
    ctx.font='bold 14px Jost,sans-serif';
    ctx.fillStyle='white';
    ctx.fillText(s.type==='question'?'❓':s.type==='mystere'?'🎁':'⚡', r-12, 5);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx,cy,22,0,Math.PI*2);
  ctx.fillStyle='white'; ctx.fill();
  ctx.strokeStyle='#8B5CF6'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#5B21B6'; ctx.font='bold 11px Jost';
  ctx.textAlign='center'; ctx.fillText('🎰',cx,cy+4);
}

function spin() {
  if (spinning || remaining.length===0) return;
  spinning=true;
  actionSel=null;
  document.getElementById('btn-spin').disabled=true;
  document.getElementById('result-card').style.display='none';

  const segs = remaining;
  const extraSpins = 5+Math.random()*5;
  const targetAngle = Math.random()*Math.PI*2;
  const totalRotation = extraSpins*Math.PI*2+targetAngle;
  const duration = 3000+Math.random()*1000;
  const start = performance.now();
  let currentAngle=0;

  function animate(now) {
    const elapsed=now-start;
    const progress=Math.min(elapsed/duration,1);
    const ease=1-Math.pow(1-progress,4);
    currentAngle=ease*totalRotation;
    drawWheel(segs, currentAngle);
    if (progress<1) { requestAnimationFrame(animate); return; }
    spinning=false;
    const finalAngle=((currentAngle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    const n=segs.length;
    const idx=Math.floor(((Math.PI*2-(finalAngle%(Math.PI*2)))/(Math.PI*2)*n+0.5)%n);
    currentSeg=segs[idx];
    // Retirer ce segment de remaining
    remaining=remaining.filter((_,i)=>i!==idx);
    showResult();
  }
  requestAnimationFrame(animate);
}

function showResult() {
  const card=document.getElementById('result-card');
  card.style.display='block';
  document.getElementById('result-type').textContent=currentSeg.label;
  document.getElementById('result-type').className='result-type '+currentSeg.type;
  document.getElementById('result-text').textContent=currentSeg.text;
  const inputArea=document.getElementById('result-input');
  const btn=document.getElementById('btn-valider');
  const isLast=(cur===total-1);

  if (currentSeg.type==='question' || currentSeg.type==='mystere') {
    inputArea.innerHTML=`<textarea class="open-area" id="oa" placeholder="Réponds honnêtement... 😏"></textarea>`;
    btn.style.display='block';
    btn.textContent=isLast?'Terminer ✨':'Suivant →';
  } else {
    // Action
    inputArea.innerHTML=`
      <div class="action-btns">
        <button class="action-btn yes" id="btn-yes" onclick="selAction(this,'oui')">✅ Je le fais !</button>
        <button class="action-btn no" onclick="selAction(this,'non')">❌ Trop peur !</button>
      </div>
      <div class="extra-input" id="extra-input">
        <textarea class="open-area" id="oa-action" placeholder="Dis-moi comment tu vas le faire... 😏"></textarea>
      </div>`;
    btn.style.display='none';
    btn.textContent=isLast?'Terminer ✨':'Suivant →';
  }
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function selAction(btn, val) {
  document.querySelectorAll('.action-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  actionSel=val;
  const extra=document.getElementById('extra-input');
  const bv=document.getElementById('btn-valider');
  if (val==='oui') {
    extra.style.display='block';
  } else {
    extra.style.display='none';
  }
  bv.style.display='block';
}

function valider() {
  let ans='';
  if (currentSeg.type==='question'||currentSeg.type==='mystere') {
    ans=document.getElementById('oa')?.value.trim()||'...';
  } else {
    if (actionSel==='oui') {
      const extra=document.getElementById('oa-action')?.value.trim()||'';
      ans='✅ Je le fais !'+(extra?'\n   → '+extra:'');
    } else {
      ans='❌ Trop peur !';
    }
  }
  answers.push({type:currentSeg.type, q:currentSeg.text, a:ans});
  cur++;
  if (cur>=total) { buildDone(); showScreen('s-done'); return; }
  document.getElementById('spin-count').textContent=`Tour ${cur+1} / ${total}`;
  document.getElementById('result-card').style.display='none';
  document.getElementById('btn-spin').disabled=false;
  // Redessiner roue avec segments restants
  drawWheel(remaining,0);
  window.scrollTo(0,0);
}

function buildDone() {
  const lines=answers.map((a,i)=>`${i+1}. [${a.type==='question'?'Question':a.type==='mystere'?'Mystère':'Action'}] ${a.q}\n➜ ${a.a}`).join('\n\n');
  document.getElementById('copy-text').textContent=`🎰 Mes réponses — Jour 8 :\n\n${lines}\n\n😘`;
}

function copyAnswers() {
  const text=document.getElementById('copy-text').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('btn-copy');
    btn.textContent='✅ Copié ! Colle ça dans WhatsApp 😘';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copier mes réponses';btn.classList.remove('copied');},3000);
  }).catch(()=>{
    const range=document.createRange();
    range.selectNode(document.getElementById('copy-text'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    const btn=document.getElementById('btn-copy');
    btn.textContent='✅ Copié !';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copier mes réponses';btn.classList.remove('copied');},3000);
  });
}

drawWheel(allSegments,0);
</script>
</body>
</html>
